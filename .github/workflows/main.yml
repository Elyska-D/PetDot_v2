name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Générer l'icône (croix santé, style Nothing)
        continue-on-error: true
        run: |
          mkdir -p assets
          convert -size 1024x1024 xc:'#000000' -fill '#d61f26' \
            -draw "roundrectangle 432,282 592,742 26,26" \
            -draw "roundrectangle 282,432 742,592 26,26" \
            assets/icon.png
          convert -size 2732x2732 xc:'#000000' -fill '#d61f26' \
            -draw "roundrectangle 1236,876 1496,1856 40,40" \
            -draw "roundrectangle 876,1236 1856,1496 40,40" \
            assets/splash.png
          npx @capacitor/assets@3 generate --android \
            --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' \
            --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'

      - name: Synchroniser
        run: npx cap sync android

      - name: Compiler l'APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: petdot-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
